version: 2.1

# REPO ORBIT — validation only. Six workflows preselected for MANUAL runs.
# CircleCI auto-populates pipeline parameters from this config.
# API/UI manual events run; push/PR/schedule events select NO workflows.
# Keep automatic VCS triggers disabled in CircleCI Project Settings too.
orbs:
  win: circleci/windows@5.0

parameters:
  run_linux:
    type: boolean
    default: true
  run_windows:
    type: boolean
    default: true
  run_macos:
    type: boolean
    default: true
  run_browser_linux:
    type: boolean
    default: true
  run_browser_windows:
    type: boolean
    default: true
  run_browser_macos:
    type: boolean
    default: true

jobs:
  native-linux:
    docker:
      - image: cimg/python:3.13
    resource_class: medium
    steps:
      - run:
          name: Preserve source LF bytes before authenticated checkout
          command: git config --global core.autocrlf false
      - checkout:
          method: full
      - run:
          name: Verify exact authenticated CircleCI commit
          command: |
            set -euo pipefail
            test -n "${CIRCLE_SHA1:-}" || { echo "HOLD: missing CIRCLE_SHA1"; exit 2; }
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1" || { echo "HOLD: checkout SHA mismatch"; exit 2; }
      - run:
          name: Native preflight, regression tests and pinned benchmarks with evidence
          no_output_timeout: 45m
          command: |
            python -u scripts/run_ci_evidence.py --platform Linux --out external-results/circleci-linux --run
      - run:
          name: Finalize self-contained evidence ZIP even when earlier tests fail
          when: always
          command: |
            python -u scripts/run_ci_evidence.py --platform Linux --out external-results/circleci-linux --package-only
      - store_artifacts:
          path: external-results/circleci-linux
          destination: repo-orbit-linux

  native-windows:
    executor: win/default
    steps:
      - run:
          name: Preserve source LF bytes before authenticated checkout
          command: |
            $ErrorActionPreference = 'Stop'
            git config --global core.autocrlf false
            if ($LASTEXITCODE -ne 0) { throw 'HOLD: git core.autocrlf configuration failed' }
      - checkout:
          method: full
      - run:
          name: Verify exact authenticated CircleCI commit
          command: |
            $ErrorActionPreference = 'Stop'
            if ([string]::IsNullOrWhiteSpace($env:CIRCLE_SHA1)) { throw 'HOLD: missing CIRCLE_SHA1' }
            $actual = (git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $env:CIRCLE_SHA1) { throw 'HOLD: checkout SHA mismatch' }
      - run:
          name: Native preflight, regression tests and pinned benchmarks with evidence
          no_output_timeout: 45m
          command: |
            python -u scripts/run_ci_evidence.py --platform Windows --out external-results/circleci-windows --run
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run:
          name: Finalize self-contained evidence ZIP even when earlier tests fail
          when: always
          command: |
            python -u scripts/run_ci_evidence.py --platform Windows --out external-results/circleci-windows --package-only
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - store_artifacts:
          path: external-results/circleci-windows
          destination: repo-orbit-windows

  native-macos:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
    steps:
      - run:
          name: Preserve source LF bytes before authenticated checkout
          command: git config --global core.autocrlf false
      - checkout:
          method: full
      - run:
          name: Verify exact authenticated CircleCI commit
          command: |
            set -euo pipefail
            test -n "${CIRCLE_SHA1:-}" || { echo "HOLD: missing CIRCLE_SHA1"; exit 2; }
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1" || { echo "HOLD: checkout SHA mismatch"; exit 2; }
      - run:
          name: Native preflight, regression tests and pinned benchmarks with evidence
          no_output_timeout: 45m
          command: |
            python3 -u scripts/run_ci_evidence.py --platform Darwin --out external-results/circleci-macos --run
      - run:
          name: Finalize self-contained evidence ZIP even when earlier tests fail
          when: always
          command: |
            python3 -u scripts/run_ci_evidence.py --platform Darwin --out external-results/circleci-macos --package-only
      - store_artifacts:
          path: external-results/circleci-macos
          destination: repo-orbit-macos

  browser-linux:
    docker:
      - image: cimg/python:3.13
    resource_class: medium
    steps:
      - run:
          name: Preserve source LF bytes before authenticated checkout
          command: git config --global core.autocrlf false
      - checkout:
          method: full
      - run:
          name: Verify exact authenticated CircleCI commit
          command: |
            set -euo pipefail
            test -n "${CIRCLE_SHA1:-}" || { echo "HOLD: missing CIRCLE_SHA1"; exit 2; }
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1" || { echo "HOLD: checkout SHA mismatch"; exit 2; }
      - run:
          name: Install pinned test-only Playwright and Chromium
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            mkdir -p external-results
            python -m venv .browser-venv
            .browser-venv/bin/python -m pip install -r requirements-browser-ci.txt 2>&1 | tee -a external-results/browser-linux-install.log
            .browser-venv/bin/python -m playwright install --with-deps chromium 2>&1 | tee -a external-results/browser-linux-install.log
      - run:
          name: Build deterministic Git fixtures and run native Chromium E2E
          no_output_timeout: 45m
          command: |
            set -euo pipefail
            .browser-venv/bin/python -u scripts/run_browser_evidence.py --platform Linux --out external-results/browser-linux --run
      - run:
          name: Finalize complete browser evidence ZIP even on earlier FAIL
          when: always
          command: |
            python -u scripts/run_browser_evidence.py --platform Linux --out external-results/browser-linux --package-only
      - store_artifacts:
          path: external-results/browser-linux
          destination: repo-orbit-r8-browser-linux

  browser-windows:
    executor: win/default
    steps:
      - run:
          name: Preserve source LF bytes before authenticated checkout
          command: |
            $ErrorActionPreference = 'Stop'
            git config --global core.autocrlf false
            if ($LASTEXITCODE -ne 0) { throw 'HOLD: git core.autocrlf configuration failed' }
      - checkout:
          method: full
      - run:
          name: Verify exact authenticated CircleCI commit
          command: |
            $ErrorActionPreference = 'Stop'
            if ([string]::IsNullOrWhiteSpace($env:CIRCLE_SHA1)) { throw 'HOLD: missing CIRCLE_SHA1' }
            $actual = (git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $env:CIRCLE_SHA1) { throw 'HOLD: checkout SHA mismatch' }
      - run:
          name: Install pinned test-only Playwright and Chromium
          no_output_timeout: 20m
          command: |
            $ErrorActionPreference = 'Stop'
            New-Item -ItemType Directory -Path external-results -Force | Out-Null
            python -m venv .browser-venv
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $browserPython = (Resolve-Path '.\.browser-venv\Scripts\python.exe').Path
            $installLog = Join-Path $PWD.Path 'external-results/browser-windows-install.log'
            function Invoke-BrowserInstall {
              param([string]$Stage, [string[]]$Arguments)
              $stdoutPath = Join-Path $PWD.Path ("external-results/browser-windows-$Stage.stdout.log")
              $stderrPath = Join-Path $PWD.Path ("external-results/browser-windows-$Stage.stderr.log")
              # Keep native stderr separate: PowerShell 5.1 converts 2>&1 to
              # NativeCommandError when ErrorActionPreference is Stop, even on exit 0.
              $process = Start-Process -FilePath $browserPython -ArgumentList $Arguments -WorkingDirectory $PWD.Path -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
              Add-Content -LiteralPath $installLog -Value ("STAGE: $Stage") -Encoding UTF8
              foreach ($path in @($stdoutPath, $stderrPath)) {
                if (Test-Path -LiteralPath $path) {
                  $content = Get-Content -LiteralPath $path -Raw -Encoding UTF8
                  if ($content) {
                    Add-Content -LiteralPath $installLog -Value $content -Encoding UTF8
                    Write-Host $content
                  }
                }
              }
              Add-Content -LiteralPath $installLog -Value ("EXIT_CODE: $($process.ExitCode)") -Encoding UTF8
              if ($process.ExitCode -ne 0) { throw "HOLD: browser $Stage installation failed with exit code $($process.ExitCode)" }
            }
            Invoke-BrowserInstall -Stage 'pip' -Arguments @('-m','pip','install','-r','requirements-browser-ci.txt')
            Invoke-BrowserInstall -Stage 'chromium' -Arguments @('-m','playwright','install','chromium')
      - run:
          name: Build deterministic Git fixtures and run native Chromium E2E
          no_output_timeout: 45m
          command: |
            $ErrorActionPreference = 'Stop'
            & .\.browser-venv\Scripts\python.exe -u scripts/run_browser_evidence.py --platform Windows --out external-results/browser-windows --run
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run:
          name: Finalize complete browser evidence ZIP even on earlier FAIL
          when: always
          command: |
            python -u scripts/run_browser_evidence.py --platform Windows --out external-results/browser-windows --package-only
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - store_artifacts:
          path: external-results/browser-windows
          destination: repo-orbit-r8-browser-windows

  browser-macos:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
    steps:
      - run:
          name: Preserve source LF bytes before authenticated checkout
          command: git config --global core.autocrlf false
      - checkout:
          method: full
      - run:
          name: Verify exact authenticated CircleCI commit
          command: |
            set -euo pipefail
            test -n "${CIRCLE_SHA1:-}" || { echo "HOLD: missing CIRCLE_SHA1"; exit 2; }
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1" || { echo "HOLD: checkout SHA mismatch"; exit 2; }
      - run:
          name: Install pinned test-only Playwright and Chromium
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            mkdir -p external-results
            python3 -m venv .browser-venv
            .browser-venv/bin/python -m pip install -r requirements-browser-ci.txt 2>&1 | tee -a external-results/browser-macos-install.log
            .browser-venv/bin/python -m playwright install chromium 2>&1 | tee -a external-results/browser-macos-install.log
      - run:
          name: Build deterministic Git fixtures and run native Chromium E2E
          no_output_timeout: 45m
          command: |
            set -euo pipefail
            .browser-venv/bin/python -u scripts/run_browser_evidence.py --platform Darwin --out external-results/browser-macos --run
      - run:
          name: Finalize complete browser evidence ZIP even on earlier FAIL
          when: always
          command: |
            python3 -u scripts/run_browser_evidence.py --platform Darwin --out external-results/browser-macos --package-only
      - store_artifacts:
          path: external-results/browser-macos
          destination: repo-orbit-r8-browser-macos

workflows:
  linux-opt-in:
    when: pipeline.event.name == "api" and pipeline.parameters.run_linux
    jobs:
      - native-linux
  windows-opt-in:
    when: pipeline.event.name == "api" and pipeline.parameters.run_windows
    jobs:
      - native-windows
  macos-opt-in:
    when: pipeline.event.name == "api" and pipeline.parameters.run_macos
    jobs:
      - native-macos
  browser-linux-opt-in:
    when: pipeline.event.name == "api" and pipeline.parameters.run_browser_linux
    jobs:
      - browser-linux
  browser-windows-opt-in:
    when: pipeline.event.name == "api" and pipeline.parameters.run_browser_windows
    jobs:
      - browser-windows
  browser-macos-opt-in:
    when: pipeline.event.name == "api" and pipeline.parameters.run_browser_macos
    jobs:
      - browser-macos
