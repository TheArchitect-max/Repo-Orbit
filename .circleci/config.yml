version: 2.1

# REPO ORBIT — validation only. All jobs opt-in.
# In CircleCI Project Settings -> Triggers, disable all automatic triggers.
orbs:
  win: circleci/windows@5.0

parameters:
  run_linux:
    type: boolean
    default: false
  run_windows:
    type: boolean
    default: false
  run_macos:
    type: boolean
    default: false

jobs:
  native-linux:
    docker:
      - image: cimg/python:3.13
    resource_class: medium
    steps:
      - run:
          name: Fetch exact CircleCI commit via public HTTPS (no SSH key)
          command: |
            set -euo pipefail
            test -n "${CIRCLE_SHA1:-}" || { echo "HOLD: missing CIRCLE_SHA1"; exit 2; }
            git clone --quiet --no-checkout https://github.com/TheArchitect-max/Repo-Orbit.git .
            git -c core.autocrlf=false -c advice.detachedHead=false checkout --quiet --detach "$CIRCLE_SHA1"
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1" || { echo "HOLD: checkout SHA mismatch"; exit 2; }
      - run:
          name: Native preflight, regression tests and pinned benchmarks with evidence
          no_output_timeout: 45m
          command: |
            python -u scripts/run_ci_evidence.py --platform Linux --out external-results/circleci-linux --run
      - run:
          name: Finalize self-contained evidence ZIP even when earlier tests fail
          when: always
          command: |
            python -u scripts/run_ci_evidence.py --platform Linux --out external-results/circleci-linux --package-only
      - store_artifacts:
          path: external-results/circleci-linux
          destination: repo-orbit-linux

  native-windows:
    executor: win/default
    steps:
      - run:
          name: Fetch exact CircleCI commit via public HTTPS (no SSH key)
          command: |
            $ErrorActionPreference = 'Stop'
            if ([string]::IsNullOrWhiteSpace($env:CIRCLE_SHA1)) { throw 'HOLD: missing CIRCLE_SHA1' }
            git clone --quiet --no-checkout https://github.com/TheArchitect-max/Repo-Orbit.git .
            if ($LASTEXITCODE -ne 0) { throw 'HOLD: HTTPS clone failed' }
            git -c core.autocrlf=false -c advice.detachedHead=false checkout --quiet --detach $env:CIRCLE_SHA1
            if ($LASTEXITCODE -ne 0) { throw 'HOLD: commit checkout failed' }
            $actual = (git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $env:CIRCLE_SHA1) { throw 'HOLD: checkout SHA mismatch' }
      - run:
          name: Native preflight, regression tests and pinned benchmarks with evidence
          no_output_timeout: 45m
          command: |
            python -u scripts/run_ci_evidence.py --platform Windows --out external-results/circleci-windows --run
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run:
          name: Finalize self-contained evidence ZIP even when earlier tests fail
          when: always
          command: |
            python -u scripts/run_ci_evidence.py --platform Windows --out external-results/circleci-windows --package-only
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - store_artifacts:
          path: external-results/circleci-windows
          destination: repo-orbit-windows

  native-macos:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
    steps:
      - run:
          name: Fetch exact CircleCI commit via public HTTPS (no SSH key)
          command: |
            set -euo pipefail
            test -n "${CIRCLE_SHA1:-}" || { echo "HOLD: missing CIRCLE_SHA1"; exit 2; }
            git clone --quiet --no-checkout https://github.com/TheArchitect-max/Repo-Orbit.git .
            git -c core.autocrlf=false -c advice.detachedHead=false checkout --quiet --detach "$CIRCLE_SHA1"
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1" || { echo "HOLD: checkout SHA mismatch"; exit 2; }
      - run:
          name: Native preflight, regression tests and pinned benchmarks with evidence
          no_output_timeout: 45m
          command: |
            python3 -u scripts/run_ci_evidence.py --platform Darwin --out external-results/circleci-macos --run
      - run:
          name: Finalize self-contained evidence ZIP even when earlier tests fail
          when: always
          command: |
            python3 -u scripts/run_ci_evidence.py --platform Darwin --out external-results/circleci-macos --package-only
      - store_artifacts:
          path: external-results/circleci-macos
          destination: repo-orbit-macos

workflows:
  linux-opt-in:
    when: << pipeline.parameters.run_linux >>
    jobs:
      - native-linux
  windows-opt-in:
    when: << pipeline.parameters.run_windows >>
    jobs:
      - native-windows
  macos-opt-in:
    when: << pipeline.parameters.run_macos >>
    jobs:
      - native-macos
