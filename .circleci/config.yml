version: 2.1

# REPO ORBIT — validation only. All jobs opt-in.
# In CircleCI Project Settings -> Triggers, disable all automatic triggers.
orbs:
  win: circleci/windows@5.0

parameters:
  run_linux:
    type: boolean
    default: false
  run_windows:
    type: boolean
    default: false
  run_macos:
    type: boolean
    default: false

jobs:
  native-linux:
    docker:
      - image: cimg/python:3.13
    resource_class: medium
    steps:
      - run:
          name: Fetch exact CircleCI commit via public HTTPS (no SSH key)
          command: |
            set -euo pipefail
            test -n "${CIRCLE_SHA1:-}" || { echo "HOLD: missing CIRCLE_SHA1"; exit 2; }
            git clone --quiet --no-checkout https://github.com/TheArchitect-max/Repo-Orbit.git .
            git -c advice.detachedHead=false checkout --quiet --detach "$CIRCLE_SHA1"
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1" || { echo "HOLD: checkout SHA mismatch"; exit 2; }
      - run:
          name: Verify Python, Git, and original source integrity
          command: |
            python --version
            python -c "import sys; assert sys.version_info >= (3, 10), sys.version"
            git --version
            python scripts/preflight_circleci.py
            python -m unittest discover -s tests -p 'test_*.py'
      - run:
          name: Pinned full-history Requests, Flask and uv performance benchmarks
          no_output_timeout: 45m
          command: |
            python -u scripts/run_circleci_native.py --out external-results/circleci-linux
      - store_artifacts:
          path: external-results/circleci-linux
          destination: repo-orbit-linux

  native-windows:
    executor: win/default
    steps:
      - run:
          name: Fetch exact CircleCI commit via public HTTPS (no SSH key)
          command: |
            $ErrorActionPreference = 'Stop'
            if ([string]::IsNullOrWhiteSpace($env:CIRCLE_SHA1)) { throw 'HOLD: missing CIRCLE_SHA1' }
            git clone --quiet --no-checkout https://github.com/TheArchitect-max/Repo-Orbit.git .
            if ($LASTEXITCODE -ne 0) { throw 'HOLD: HTTPS clone failed' }
            git -c advice.detachedHead=false checkout --quiet --detach $env:CIRCLE_SHA1
            if ($LASTEXITCODE -ne 0) { throw 'HOLD: commit checkout failed' }
            $actual = (git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $env:CIRCLE_SHA1) { throw 'HOLD: checkout SHA mismatch' }
      - run:
          name: Verify native Windows, Python, Git and source integrity
          command: |
            $ErrorActionPreference = 'Stop'
            python --version
            python -c "import sys; assert sys.version_info >= (3, 10), sys.version"
            git --version
            python scripts/preflight_circleci.py
            python -m unittest discover -s tests -p 'test_*.py'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run:
          name: Pinned full-history Requests, Flask and uv performance benchmarks
          no_output_timeout: 45m
          command: |
            $ErrorActionPreference = 'Stop'
            python -u scripts/run_circleci_native.py --out external-results/circleci-windows
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - store_artifacts:
          path: external-results/circleci-windows
          destination: repo-orbit-windows

  native-macos:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
    steps:
      - run:
          name: Fetch exact CircleCI commit via public HTTPS (no SSH key)
          command: |
            set -euo pipefail
            test -n "${CIRCLE_SHA1:-}" || { echo "HOLD: missing CIRCLE_SHA1"; exit 2; }
            git clone --quiet --no-checkout https://github.com/TheArchitect-max/Repo-Orbit.git .
            git -c advice.detachedHead=false checkout --quiet --detach "$CIRCLE_SHA1"
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1" || { echo "HOLD: checkout SHA mismatch"; exit 2; }
      - run:
          name: Verify native macOS, Python, Git and source integrity
          command: |
            python3 --version
            python3 -c "import sys; assert sys.version_info >= (3, 10), sys.version"
            git --version
            python3 scripts/preflight_circleci.py
            python3 -m unittest discover -s tests -p 'test_*.py'
      - run:
          name: Pinned full-history Requests, Flask and uv performance benchmarks
          no_output_timeout: 45m
          command: |
            python3 -u scripts/run_circleci_native.py --out external-results/circleci-macos
      - store_artifacts:
          path: external-results/circleci-macos
          destination: repo-orbit-macos

workflows:
  linux-opt-in:
    when: << pipeline.parameters.run_linux >>
    jobs:
      - native-linux
  windows-opt-in:
    when: << pipeline.parameters.run_windows >>
    jobs:
      - native-windows
  macos-opt-in:
    when: << pipeline.parameters.run_macos >>
    jobs:
      - native-macos
